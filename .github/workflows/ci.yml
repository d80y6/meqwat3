name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck · test · build)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meqwat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/meqwat_test
      RLS_TEST_DATABASE_URL: postgresql://meqwat_app:ci-test-only-password@127.0.0.1:5432/meqwat_test
      APP_DATABASE_URL: postgresql://meqwat_app:ci-test-only-password@127.0.0.1:5432/meqwat_test
      TEST_APP_PASSWORD: ci-test-only-password
      AUTH_SECRET: ci-only-secret-not-for-production-0123456789
      ARENA_PREVIEW: "1" # isolated HTTP browser fixture only, never production
      APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate route types
        run: npx next typegen
      - name: TypeScript (strict)
        run: npm exec tsc -- --noEmit --pretty false
      - name: Apply database schema
        run: npm run db:migrate
      - name: Restricted application role
        run: npx tsx scripts/test-role.ts
      - name: Lint source
        run: npm run lint
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Isolated demo fixtures for browser journeys
        run: npx tsx src/db/seed.ts
      - name: Unit + integration tests (real PostgreSQL)
        run: npx vitest run
      - name: Install PostgreSQL recovery tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Isolated backup and restore drill
        run: python scripts/ci-capture.py node scripts/verify-backup-restore.mjs
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (E2E)
        run: npx playwright test

  flutter:
    name: Mobile (analyze · test · build APK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android wrapper and icon scaffolding
        run: python ../scripts/ci-capture.py flutter create --no-pub --project-name meqwat_mobile --org com.meqwat --platforms=android .
      - name: Restore committed sources (in case create touched them)
        run: |
          git restore -- pubspec.yaml lib analysis_options.yaml test
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi
      - run: python ../scripts/ci-capture.py flutter pub get
      - name: Analyze
        run: python ../scripts/ci-capture.py flutter analyze --no-fatal-infos
      - name: Test
        run: python ../scripts/ci-capture.py flutter test
      - name: Build debug APK (compile proof)
        run: python ../scripts/ci-capture.py flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meqwat-mobile-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  docker:
    name: Docker image and restricted runtime
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meqwat_container_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/meqwat_container_test
      APP_DATABASE_URL: postgresql://meqwat_app:ci-container-only-password@127.0.0.1:5432/meqwat_container_test
      AUTH_SECRET: ci-container-only-signing-secret-0123456789
      TEST_APP_PASSWORD: ci-container-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: meqwat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migrate and bootstrap isolated container database
        run: |
          docker run --rm --network host -e DATABASE_URL -e AUTH_SECRET meqwat:ci npm run db:migrate
          docker run --rm --network host -e DATABASE_URL -e TEST_APP_PASSWORD meqwat:ci npx tsx scripts/test-role.ts
          docker run --rm --network host -e DATABASE_URL -e AUTH_SECRET -e ADMIN_PASSWORD=ci-only-admin-password-1234 -e ADMIN_EMAIL=container@test.ye meqwat:ci npx tsx src/db/bootstrap.ts
      - name: Restricted runtime health
        run: |
          docker run -d --name meqwat-ci-app --network host -e DATABASE_URL="$APP_DATABASE_URL" -e AUTH_SECRET meqwat:ci
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:3000/api/health
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs meqwat-ci-app || true
          docker rm -f meqwat-ci-app || true


  mobile-device:
    name: Android persistence acceptance
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Scaffold without overwriting application sources
        run: |
          python ../scripts/ci-capture.py flutter create --no-pub --project-name meqwat_mobile --org com.meqwat --platforms=android .
          git restore -- pubspec.yaml lib analysis_options.yaml test
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then rm -f test/widget_test.dart; fi
          python ../scripts/ci-capture.py flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android SQLite and secure-storage acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          working-directory: mobile
          script: python ../scripts/ci-capture.py flutter test integration_test/persistence_test.dart -d emulator-5554
