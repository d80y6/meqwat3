services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meqwat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: meqwat
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - meqwat_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meqwat"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not exposed publicly in production; uncomment only for local debugging.
    # ports: ["5432:5432"]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://meqwat_app:${APP_DB_PASSWORD}@db:5432/meqwat
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET to a long random value}
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  meqwat_pgdata:
