plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def signingFile = rootProject.file("key.properties")
def signingProperties = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains("release") } && !signingFile.exists()) {
        throw new GradleException("Release signing requires private android/key.properties; debug signing is never used for release.")
    }
}

android {
    namespace = "com.meqwat.mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // Stable application identity; review before first store publication.
        applicationId = "com.meqwat.mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                keyAlias = signingProperties['keyAlias']
                keyPassword = signingProperties['keyPassword']
                storeFile = file(signingProperties['storeFile'])
                storePassword = signingProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
